[package]
name = "ownnotes-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
url = "2"
quick-xml = "0.41"
percent-encoding = "2"
latex2mathml = "0.2.3"
aes-gcm = "0.10"
pbkdf2 = "0.12"
