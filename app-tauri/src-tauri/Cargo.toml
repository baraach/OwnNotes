[package]
name = "ownnotes-tauri"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "ownnotes_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
ownnotes-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
zip = "2"
url = "2"
percent-encoding = "2"
